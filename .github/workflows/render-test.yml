name: Render test video (no publishing)

on:
  workflow_dispatch:
    inputs:
      story:
        description: "Story script file name in stories/ (e.g. animation-test-01.txt)"
        required: true
        default: "animation-test-01.txt"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Render (no upload, no push)
        env:
          STORY: ${{ github.event.inputs.story }}
        run: python story/lesson.py "stories/$STORY" -o output
      - uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: output/
