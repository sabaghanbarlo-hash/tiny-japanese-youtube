name: Render YouTube lesson

on:
  workflow_dispatch:
    inputs:
      lesson:
        description: "Lesson script in lessons/ (e.g. 01-first-day-at-school.txt). Leave empty to render all."
        required: false
        default: ""
  push:
    paths:
      - "lessons/*.txt"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Render
        env:
          STRICT_VOICE: "1"
          LESSON: ${{ github.event.inputs.lesson }}
        run: |
          if [ -n "$LESSON" ]; then files="lessons/$LESSON"; else files=$(ls lessons/*.txt); fi
          for f in $files; do python lesson.py "$f" -o output; done
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-lessons
          path: output/
