name: Scheduled publishing

# Every day: renders and uploads (as private + a publish time) every video in schedule.json that is
# due within the look-ahead window. YouTube then publishes each video by itself at its time.
# Run it by hand any time: Actions > Scheduled publishing > Run workflow.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Render and upload what is due
        env:
          STRICT_VOICE: "1"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scheduler.py
      - name: Record what was uploaded
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/videos
          git add docs/videos
          git commit -m "Scheduled publishing: record uploads" || exit 0
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((RANDOM % 15 + 5))
          done
